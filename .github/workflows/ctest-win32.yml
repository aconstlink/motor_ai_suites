name: CTest Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure console tests
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build console tests
        run: >-
          cmake --build build --config ${{ matrix.build_type }} --parallel 4
          --target 00_threads_parallel_for 00_wire_slots 01_wire_bridges 00_document 01_document_obj
          00_vector 01_matrix 02_transformation 03_util 04_quaternion
          01_sync_primitives 02_task_graph 00_memory_ownership 01_memory_allocations

      - name: Test console suites
        run: ctest --test-dir build -C ${{ matrix.build_type }} -L "concurrent|wire|core|math|memory" --output-on-failure --no-tests=error
